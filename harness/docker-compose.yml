# Starts the aerie image for the commit under test, as its own compose project "aerie-lab".
#   AERIE_TAG=sha-cd7b0e8 docker compose -p aerie-lab -f harness/docker-compose.yml up -d aerie
#   AERIE_SETUP_CODE="$(docker compose -p aerie-lab -f harness/docker-compose.yml exec -T aerie cat /app/App_Data/setup-code.txt)" python -I harness/seed.py
#   docker compose -p aerie-lab -f harness/docker-compose.yml --profile runner down -v
# The image declares no HEALTHCHECK, so seed.py waits for GET /api/v1/setup/status.
# The "runner" service (profile runner) is the toolbox run-lab.sh uses, so the host needs only docker:
# Python 3.12 with the suite dependencies, JDK 17 with Maven, Node with npm.
name: aerie-lab
services:
  aerie:
    image: ghcr.io/synssins/aerie:${AERIE_TAG:?set AERIE_TAG to the image tag under test, e.g. sha-cd7b0e8}
    ports:
      - "${AERIE_PORT:-8080}:8080"
    # Optional settings for the image (git-ignored); seeding needs none.
    env_file:
      - path: aerie.env
        required: false
    networks: [default, scan]
    volumes:
      # Anonymous volume over the image's data folder: every run starts empty; `down -v` removes it.
      - /app/App_Data

  runner:
    profiles: [runner]
    image: aerie-lab-runner:local
    build:
      context: ../suites
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        RUN apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless maven nodejs npm curl ca-certificates \
            && rm -rf /var/lib/apt/lists/*
        COPY requirements.txt /tmp/requirements.txt
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
    # Files written into the checkout stay owned by the user who runs the lab.
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      HOME: /tmp
      AERIE_SETUP_CODE: ${AERIE_SETUP_CODE:-}
    working_dir: /lab
    volumes:
      - ..:/lab

  # The security/zap stage (security/zap/README.md): OWASP ZAP 2.17.0, the official image
  # ghcr.io/zaproxy/zaproxy:stable as of 2026-11-16, pinned by digest. It joins only the network "scan",
  # which is internal: ZAP reaches the lab's aerie and nothing else, not the host, the LAN or the internet.
  zap:
    profiles: [zap]
    image: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    environment:
      HOME: /tmp
      # Java's preferences store would otherwise warn every 30 s that it cannot write under the image's home.
      _JAVA_OPTIONS: -Djava.util.prefs.userRoot=/tmp/zap-prefs
    networks: [scan]
    volumes:
      - ../reports/security-zap/work:/zap/wrk

networks:
  scan:
    internal: true
